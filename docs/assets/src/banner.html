<!doctype html>
<!-- Source for docs/assets/banner.png: screenshot this page in headless Chromium at 1280×640, deviceScaleFactor 2. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Nunito; font-weight: 200 1000; src: url(../../../node_modules/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; font-family: Nunito, sans-serif; color: #2b2520;
    background:
      radial-gradient(620px 420px at 82% 46%, rgba(116,98,232,.22), transparent 70%),
      radial-gradient(420px 320px at 4% 104%, rgba(242,172,114,.28), transparent 70%),
      #fbf7f1; }
  .copy { position: absolute; left: 84px; top: 0; bottom: 0; width: 620px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 28px; }
  .brand img { width: 116px; height: 116px; filter: drop-shadow(0 16px 28px rgba(106,85,227,.35)); }
  h1 { font-size: 94px; font-weight: 900; letter-spacing: -0.035em; line-height: 1; }
  p { margin-top: 30px; font-size: 30px; font-weight: 600; line-height: 1.35; color: #766a5f; }
  .chips { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; font-size: 18px; font-weight: 700; background: #fff; box-shadow: 0 2px 10px rgba(70,45,20,.08); }
  .chip i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .phone { position: absolute; width: 258px; border-radius: 40px; padding: 8px; background: #2b2520; box-shadow: 0 30px 70px rgba(70,45,20,.28); }
  .phone img { display: block; width: 100%; border-radius: 33px; }
  .back { left: 985px; top: 92px; transform: rotate(6deg); }
  .front { left: 760px; top: 122px; transform: rotate(-5deg); z-index: 1; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../icon.svg" alt=""><h1>Chronicals</h1></div>
    <p>A friendly symptom and trigger diary<br>for Android</p>
    <div class="chips">
      <span class="chip"><i style="background:#3b82f6"></i>Headaches</span>
      <span class="chip"><i style="background:#a855f7"></i>Stomach</span>
      <span class="chip"><i style="background:#22c55e"></i>Allergies</span>
      <span class="chip"><i style="background:#ec4899"></i>Cycle</span>
    </div>
  </div>
  <div class="phone back"><img src="../../screenshots/insights-light.png" alt=""></div>
  <div class="phone front"><img src="../../screenshots/today-light.png" alt=""></div>
</body>
</html>
