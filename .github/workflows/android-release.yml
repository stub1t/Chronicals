# Builds the standalone Android app and publishes a signed APK as a GitHub Release.
#
# Release: push a tag like v0.2.0  (git tag v0.2.0 && git push origin v0.2.0)
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of .signing/chronicals-release.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Android release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and release, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Derive version from tag
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must be <= 99 to keep versionCode monotonic"; exit 1
          fi
          echo "CHRONICALS_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "CHRONICALS_VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_ENV"

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$KEYSTORE" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]} (see header of this workflow)"; exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CHRONICALS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build web app and sync into Android project
        run: |
          npm ci
          npm run android:sync

      - name: Build signed APK
        working-directory: android
        env:
          CHRONICALS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHRONICALS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHRONICALS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --print-certs "$apk" | head -n 3
          cp "$apk" "chronicals-$CHRONICALS_VERSION_NAME.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="chronicals-$CHRONICALS_VERSION_NAME.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" --title "chronicals $CHRONICALS_VERSION_NAME" --generate-notes
          fi
