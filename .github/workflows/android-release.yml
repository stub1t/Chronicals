# Builds the standalone Android app and publishes a signed APK as a GitHub Release.
#
# Release: `npm run release`, or Actions → Android release → Run workflow (on main).
# Versions are the UTC release date: v2026.10.13, then v2026.10.13.2 for a second
# release that day. versionCode = YYYYMMDD * 100 + n, so it only ever increases.
# The workflow creates the tag itself.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of .signing/chronicals-release.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Android release

on:
  workflow_dispatch:
    inputs:
      rebuild_tag:
        description: Leave empty for a new release. Or an existing tag (e.g. v2026.10.13) to rebuild its APK.
        required: false
        default: ''

permissions:
  contents: write

# One release at a time, so two runs on the same day can't pick the same version.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      REBUILD_TAG: ${{ inputs.rebuild_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.rebuild_tag }}

      - name: Determine version
        run: |
          if [[ -n "$REBUILD_TAG" ]]; then
            if [[ ! "$REBUILD_TAG" =~ ^v([0-9]{4}\.[0-9]{2}\.[0-9]{2})(\.([0-9]+))?$ ]]; then
              echo "::error::'$REBUILD_TAG' is not a date tag like v2026.10.13 or v2026.10.13.2"; exit 1
            fi
            tag=$REBUILD_TAG date=${BASH_REMATCH[1]} n=${BASH_REMATCH[3]:-1}
          else
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::New releases are cut from main (this run is on $GITHUB_REF)"; exit 1
            fi
            date=$(date -u +%Y.%m.%d)
            # Highest release number already used today: v<date> counts as 1, v<date>.<k> as k.
            last=0
            while read -r _ ref; do
              t=${ref#refs/tags/}
              if [[ "$t" == "v$date" ]]; then k=1
              elif [[ "$t" =~ ^v${date//./\\.}\.([0-9]+)$ ]]; then k=${BASH_REMATCH[1]}
              else continue
              fi
              if (( k > last )); then last=$k; fi
            done < <(git ls-remote --tags --refs origin)
            n=$(( last + 1 ))
            tag="v$date"
            if (( n > 1 )); then tag="v$date.$n"; fi
          fi
          if (( n > 99 )); then
            echo "::error::More than 99 releases on $date"; exit 1
          fi
          version=${tag#v}
          echo "Releasing $tag (versionCode ${date//./}$(printf %02d "$n"))"
          {
            echo "TAG=$tag"
            echo "CHRONICALS_VERSION_NAME=$version"
            echo "CHRONICALS_VERSION_CODE=${date//./}$(printf %02d "$n")"
          } >> "$GITHUB_ENV"

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$KEYSTORE" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]} (see header of this workflow)"; exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CHRONICALS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build web app and sync into Android project
        run: |
          npm ci
          npm run android:sync

      - name: Build signed APK
        working-directory: android
        env:
          CHRONICALS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHRONICALS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHRONICALS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --print-certs "$apk" | head -n 3
          cp "$apk" "chronicals-$CHRONICALS_VERSION_NAME.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="chronicals-$CHRONICALS_VERSION_NAME.apk"
          if [[ -n "$REBUILD_TAG" ]]; then
            gh release upload "$TAG" "$apk" --clobber
          else
            # Creates the tag on the commit that was just built.
            gh release create "$TAG" "$apk" --target "$GITHUB_SHA" \
              --title "Chronicals $CHRONICALS_VERSION_NAME" --generate-notes
          fi
