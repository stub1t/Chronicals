services:
  chronicals:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - chronicals_data:/data
    environment:
      DATABASE_PATH: /data/chronicals.db
      NODE_ENV: production
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    mem_limit: 256m
    cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  chronicals_data:
